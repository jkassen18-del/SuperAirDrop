plugins {
    id 'com.android.application'
}

android {
    namespace 'com.superairdrop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.superairdrop'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    sourceSets {
        // The same web app the Node server serves, bundled into the APK.
        main.assets.srcDirs += ['../../public']
    }

    // A fixed key lets new versions install over old ones. CI writes it from
    // the ANDROID_KEYSTORE_BASE64 secret; without it the debug key is used.
    def releaseKey = file('../superairdrop.keystore')
    signingConfigs {
        release {
            if (releaseKey.exists()) {
                storeFile releaseKey
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
                keyAlias 'superairdrop'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKey.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
